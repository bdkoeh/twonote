# Run from the repository root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  twonote:
    image: twonote-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: twonote
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - twonote-data:/data

volumes:
  twonote-data:
